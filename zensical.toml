[project]
variant = "modern"
site_name = "Color-Chan Wiki"
site_description = "The official wiki for Color-Chan Discord Bot"
site_url = "https://wiki.colorchan.com"
dev_addr = "http://127.0.0.1:7562"
site_author = "Color-Chan"
docs_dir = "docs"
site_dir = "site"

[project.theme]
language = "en"
logo = "https://cdn.colorchan.com/favicon.ico"
favicon = "https://cdn.colorchan.com/favicon.ico"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.top",
    "navigation.footer",
    "navigation.sections",
    "search.highlight",
]

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://colorchan.com/permalinks/support"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "green"
accent = "green"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "green"
accent = "green"

# Markdown Extensions
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
[project.markdown_extensions.pymdownx.blocks.caption]