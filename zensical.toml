[project]
variant = "modern"
site_name = "Color-Chan Wiki"
site_description = "The official wiki for the Color-Chan Discord Bot"
site_url = "https://wiki.colorchan.com"
dev_addr = "127.0.0.1:7562"
site_author = "Color-Chan"
copyright = "Copyright &copy; Color-Chan"
repo_url = "https://github.com/Color-Chan/Color-Chan.Wiki"
repo_name = "Color-Chan/Color-Chan.Wiki"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

[project.theme]
language = "en"
logo = "https://cdn.colorchan.com/favicon.ico"
favicon = "https://cdn.colorchan.com/favicon.ico"
custom_dir = "overrides"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.top",
    "navigation.footer",
    "navigation.sections",
    "navigation.indexes",
    "navigation.path",
    "search.highlight",
    "search.suggest",
    "toc.follow",
    "content.action.edit",
]

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://colorchan.com/permalinks/support"

[project.extra.analytics]
provider = "custom"
property = "e31a5e97-2bfe-4c01-aeea-5b733886bbf3"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "green"
accent = "green"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "green"
accent = "green"

# Markdown Extensions
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.blocks.caption]